# The base builds and its tests pass on every platform it claims to confine
# nodes on. A runner is added here only once that platform has a sandbox
# backend: the base refuses to run nodes where it cannot confine them.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      # Every platform reports; one failing does not hide the others.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # One platform checks formatting; it is the same source everywhere.
      - run: cargo fmt --all --check
        if: matrix.os == 'macos-latest'
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
