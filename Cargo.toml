[package]
name = "cartridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.89"
autotests = false
default-run = "cartridge"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cartridge"
path = "src/main.rs"

[[test]]
name = "launch"
path = ".cartridge/tests/integration/launch.rs"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.56", default-features = false }
thiserror = "2"
getrandom = "0.3"
libloading = "0.9"
# The trust store. `oid` (default) drags in const-oid, which nothing here emits.
sha2 = { version = "0.11", default-features = false, features = ["alloc"] }
mlua = { version = "0.12", features = ["lua54", "vendored", "send", "serde", "async"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "registry", "std"] }
notify = "9.0.0-rc.5"
clap = { version = "4", features = ["derive"] }
# The `help` picker: raw keys and the alternate screen.
crossterm = "0.29"
# `help` and `settings` cut and pad to terminal cells: a wide glyph is two
# cells and a ZWJ cluster is many chars.
unicode-width = "0.2"
unicode-segmentation = "1.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Reuse-port on the listeners the host keeps for its nodes, so a replacing
# host binds beside the one it replaces.
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Security_Authorization",
	"Win32_Security_Isolation",
	"Win32_Storage_FileSystem",
	"Win32_System_Console",
	"Win32_System_JobObjects",
	"Win32_System_Pipes",
	"Win32_System_SystemServices",
	"Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Neither crate is cfg-gated internally; outside this target the macOS build breaks.
landlock = { version = "0.4.7", default-features = false }
seccompiler = { version = "0.5.0", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53", features = ["full", "test-util"] }

[lints.rust]
warnings = "deny"

# Independent of any containing workspace. The native fixture is its own: a
# Lua module links against the base's Lua, so it cannot share mlua features.
[workspace]
exclude = [".cartridge/tests/unit/src/tests/fixtures/native"]

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
