[package]
name = "cartridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.89"
autotests = false
default-run = "cartridge"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cartridge"
path = "src/main.rs"

# A process cartridge the host tests start: speaks the transport protocol.
[[example]]
name = "echo_fixture"
path = ".cartridge/tests/unit/src/tests/fixtures/echo_fixture.rs"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
futures = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
transport = { path = "src/transport" }
libc = "0.2"
thiserror = "2"
mlua = { version = "0.12", features = ["lua54", "vendored", "send", "serde", "async"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "registry", "std"] }
notify = "9.0.0-rc.5"
clap = { version = "4", features = ["derive"] }
# The `help` picker: raw keys and the alternate screen.
crossterm = "0.29"
[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53", features = ["full", "test-util"] }

[lints.rust]
warnings = "deny"

# Keep the runtime and its isolated worktrees independent of a containing workspace.
[workspace]
members = ["src/transport", "src/transport/macros"]

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
